services:
  - type: web
    name: grocery-tracker
    env: node
    plan: free
    buildCommand: npm install && npm run db:push && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false # set manually in the Render dashboard — your Turso database's libsql:// URL
      - key: TURSO_AUTH_TOKEN
        sync: false # set manually in the Render dashboard — never commit a Turso auth token
