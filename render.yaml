services:
  - type: web
    name: grocery-tracker
    env: node
    plan: free
    buildCommand: npm install && npm run db:push && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # set manually in the Render dashboard — Atlas connection string, never committed
